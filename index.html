      d: { en: ["Planned a mobility idea for people with limited mobility; as team lead, I drove the problem definition and the business-plan pitch."], ko: ["이동약자를 위한 모빌리티 아이디어를 기획했고, 팀장으로 문제 정의와 사업계획 발표를 이끌었습니다."] } },
    { t: { en: "Capstone Design Idea Contest (E-Brain Festival)", ko: "캡스톤디자인 아이디어 경진대회 (E-브레인 페스티벌)" }, m: { en: "Gold Prize · KNU", ko: "금상 · KNU" }, date: "2021.11",
      d: { en: ["Handled idea planning, prototyping and the presentation."], ko: ["아이디어 기획, 프로토타입 제작, 발표를 진행했습니다."] } },
    { t: { en: "Creative Convergence Design Camp", ko: "창의융합설계캠프" }, m: { en: "Technology Innovation Award · KNU", ko: "기술혁신상 · KNU" }, date: "2020.08",
      d: { en: ["Proposed a technology idea addressing social and safety issues."], ko: ["사회문제와 안전 이슈를 주제로 한 기술 아이디어를 제안했습니다."] } },
    { t: { en: "Local Issue ICT Video Contest", ko: "지역문제 발굴 ICT 영상 공모전" }, m: { en: "Encouragement Award · Yongin Digital Industry Promotion Agency", ko: "장려상 · 용인시디지털산업진흥원" }, date: "2020.08",
      d: { en: ["Contest theme: local issues in Yongin such as transportation, environment and housing.", "Identified a local problem and proposed an ICT-based solution in a short video."],
           ko: ["공모 주제: 교통·환경·주거 등 용인시의 지역 문제", "지역 문제를 발굴하고 ICT를 활용한 해결 아이디어를 영상으로 제시했습니다."] } },
  ]},
];

const SKILLS = [
  [{ en: "Programming", ko: "프로그래밍" }, "Python · PyTorch"],
  [{ en: "Robotics & systems", ko: "로봇 · 시스템" }, "Isaac Sim · ROS · NVIDIA Jetson · Docker · Linux"],
  [{ en: "Languages", ko: "언어" }, { en: "Korean (native) · English (intermediate) · Spanish (DELE B1)", ko: "한국어(모국어) · 영어(중급) · 스페인어(중급, DELE B1)" }],
];

const $ = (s, c = document) => c.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let lang = "en";
const L = (v) => (v && typeof v === "object" && !Array.isArray(v) && ("en" in v || "ko" in v)) ? (v[lang] ?? v.en) : v;
const rich = (v) => { const x = L(v); return Array.isArray(x) ? x.map((p) => Array.isArray(p) ? `<b>${esc(p[0])}</b>` : esc(p)).join("") : esc(x); };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const icon = (id) => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;

const QS = new URLSearchParams(location.search);
const SHOW_SLOTS = QS.get("slots") === "1" || QS.get("review") === "1";
const isVideo = (p) => /\.(mp4|webm)$/i.test(p);
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

const M = (k) => { const v = k && MEDIA[k]; if (!v) return [];
  return (Array.isArray(v) ? v : [v]).map((x) => typeof x === "string" ? { src: x } : x).filter((x) => x && x.src); };
function mediaTag(m, alt, big = false) {
  const src = esc(encodeURI(m.src)), pos = m.pos && !big ? ` style="object-position:${esc(m.pos)}"` : "";
  return isVideo(m.src)
    ? `<video src="${src}"${RM ? "" : " autoplay"} muted loop playsinline preload="metadata"${big || RM ? " controls" : ""} aria-label="${esc(alt)}"${pos}></video>`
    : `<img src="${src}" alt="${esc(alt)}" loading="lazy"${pos}>`;
}
const figsHTML = (med, alt) => `<div class="media">${med.map((m) => `<figure>${mediaTag(m, L(m.cap) || alt, true)}${m.cap ? `<figcaption>${esc(L(m.cap))}</figcaption>` : ""}</figure>`).join("")}</div>`;

function fit(t) {
  const box = t.parentElement; if (!box || !box.hasAttribute("data-fit")) return;
  const w = t.naturalWidth || t.videoWidth, h = t.naturalHeight || t.videoHeight; if (!w || !h) return;
  const r = Math.min(2, Math.max(0.8, w / h));
  box.style.aspectRatio = String(r); box.classList.toggle("tall", r < 1);
}
document.addEventListener("load", (e) => { if (e.target.tagName === "IMG") fit(e.target); }, true);
document.addEventListener("loadedmetadata", (e) => fit(e.target), true);

document.addEventListener("error", (e) => { const t = e.target;
  if (t.tagName !== "IMG" && t.tagName !== "VIDEO") return;
  const box = t.closest(".mcell, figure, .thumb"); if (!box) return;
  if (box.classList.contains("thumb")) {
    box.style.visibility = "hidden";
  } else box.style.display = "none"; }, true);
const pendHTML = (p) => SHOW_SLOTS && p ? `<div class="pend">[PENDING] ${esc(L(p))}</div>` : "";
function slotHTML(key, cls = "") { return `<div class="slot ${cls}">${esc(MEDIA_LABEL[key] || "media")} · MEDIA.${key}</div>`; }
function linksHTML() {
  const a = [];
  const mail = CONFIG.email || CONFIG.emailSchool;
  if (mail) a.push(`<a href="mailto:${esc(mail)}">${icon("mail")}${esc(L(UI.email))}</a>`);
  if (CONFIG.github) a.push(`<a href="${esc(CONFIG.github)}" target="_blank" rel="noopener">${icon("github")}GitHub</a>`);
  else if (SHOW_SLOTS) a.push(`<span class="pend-inline">${icon("github")}GitHub [PENDING]</span>`);
  if (CONFIG.linkedin) a.push(`<a href="${esc(CONFIG.linkedin)}" target="_blank" rel="noopener">${icon("in")}LinkedIn</a>`);
  else if (SHOW_SLOTS) a.push(`<span class="pend-inline">${icon("in")}LinkedIn [PENDING]</span>`);
  if (CONFIG.scholar) a.push(`<a href="${esc(CONFIG.scholar)}" target="_blank" rel="noopener">${icon("scholar")}Scholar</a>`);
  if (CONFIG.cv) a.push(`<a href="${esc(CONFIG.cv)}" target="_blank" rel="noopener">${icon("doc")}CV</a>`);
  return a.join("");
}

function itemHTML(sec, it, idx) {

  const med = M(it.media), slot = it.media && !med.length && SHOW_SLOTS;
  const click = !!(it.d || it.img || med.length || it.courses || (sec.compact && it.ln));
  const th = slot ? `<div class="mblock"><div class="mcell">${slotHTML(it.media)}</div></div>` : "";
  const inner = `<div style="min-width:0;flex:1"><div class="tt">${esc(L(it.t))}</div>${it.m ? `<div class="mt">${esc(L(it.m))}</div>` : ""}${it.ln && !sec.compact ? `<div class="ln">${esc(L(it.ln))}</div>` : ""}${th}${pendHTML(it.pending)}</div><div class="dt">${esc(L(it.date))}</div>`;
  return `<li>${click ? `<button type="button" class="it" data-sec="${sec.id}" data-idx="${idx}" aria-haspopup="dialog">${inner}</button>` : `<div class="it static">${inner}</div>`}</li>`;
}
const moreLabel = (k) => lang === "ko" ? `+${k}건 더보기` : `+${k} more`;
function blockHTML(sec, heading = "h2") {
  const vis = sec.showAll ? sec.items : sec.items.slice(0, sec.visible ?? 3);
  const hid = sec.showAll ? [] : sec.items.slice(sec.visible ?? 3);
  const n = `<span class="cnt">${sec.items.length}</span>`;
  const H = heading === "h2" ? `<h2 id="h-${sec.id}">${esc(L(sec.title))}${n}</h2>` : `<h3 id="h-${sec.id}">${esc(L(sec.title))}${n}</h3>`;
  return `<div class="gh">${H}${hid.length ? `<button class="toggle" type="button" aria-expanded="false" aria-controls="p-${sec.id}" data-n="${hid.length}">${esc(moreLabel(hid.length))}</button>` : ""}</div>
    <ul class="ul">${vis.map((it, i) => itemHTML(sec, it, i)).join("")}</ul>
    ${hid.length ? `<div class="panel" id="p-${sec.id}" data-open="false" aria-hidden="true" inert><div><ul class="ul">${hid.map((it, i) => itemHTML(sec, it, i + vis.length)).join("")}</ul></div></div>` : ""}`;
}

function renderCV() {
  const S = (id) => CV.find((c) => c.id === id);
  const exp = S("experience"), teach = S("teaching"), hands = S("handson");
  $("#cv").innerHTML =
    `<div class="grp reveal">${blockHTML(S("education"))}</div>` +
    `<div class="grp reveal">${blockHTML(S("projects"))}</div>` +
    `<div class="grp reveal"><h2 class="gtitle">${lang === "ko" ? "경험" : "Experience"}</h2>${blockHTML(exp, "h3")}
       <div class="cols" style="margin-top:32px"><div>${blockHTML(teach, "h3")}</div><div>${blockHTML(hands, "h3")}</div></div></div>` +
    `<div class="grp reveal">${blockHTML(S("awards"))}</div>` +
    `<div class="grp last reveal"><div class="gh"><h2>${lang === "ko" ? "기술 · 언어" : "Skills & Languages"}</h2></div>
       <ul class="kv">${SKILLS.map(([k, v]) => `<li><b>${esc(L(k))}</b><span>${esc(L(v))}</span></li>`).join("")}</ul></div>`;
}

function renderResearch() {
  $("#research-list").innerHTML = RESEARCH.map((r, i) => {
    const med = M(r.media);
    const inner = med.length ? mediaTag(med[0], L(r.t)) : r.media && SHOW_SLOTS ? slotHTML(r.media, "")
                : r.thumb?.src ? `<img src="${esc(r.thumb.src)}" alt="${esc(r.thumb.alt)}" loading="lazy">` : "";
    const zoom = med.length || r.thumb?.src;
    const thumb = zoom ? `<button type="button" class="thumb" data-r="${i}"${med.length ? " data-fit" : ""} aria-haspopup="dialog" aria-label="${esc(L(r.t))}">${inner}</button>` : `<div class="thumb">${inner}</div>`;
    return `
    <article class="r reveal">
      ${thumb}
      <div><span class="st">${esc(L(r.st))}</span><h3>${esc(L(r.t))}</h3>${r.tag ? `<div class="tag">${esc(L(r.tag))}</div>` : ""}
        ${r.lines.map((l) => `<p class="${l.q ? "q" : ""}">${rich(l)}</p>`).join("")}${pendHTML(r.pending)}</div>
    </article>`; }).join("");
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach((el) => { const v = UI[el.dataset.i]; if (v) el.textContent = L(v); });
  const nm = lang === "ko" && CONFIG.nameKo ? CONFIG.nameKo : PROFILE.name;
  $("#brand").textContent = nm; $("#name").textContent = nm; $("#fname").textContent = PROFILE.name;
  $("#role").textContent = L(PROFILE.role); $("#status").textContent = L(PROFILE.status); $("#bio").textContent = L(PROFILE.bio);
  $("#links").innerHTML = linksHTML(); $("#links2").innerHTML = linksHTML();
  $("#keywords").innerHTML = PROFILE.keywords.map((k) => `<span class="chip">${esc(k)}</span>`).join("");
  $("#pub-list").innerHTML = PUBS.map((p) => `<li><div class="t">${esc(L(p.t))}</div><div class="a">${L(p.a)}</div><div class="v">${L(p.v)}</div>${pendHTML(p.pending)}</li>`).join("");
  $("#lang").textContent = L(UI.langBtn);
  $("#lang").setAttribute("aria-label", lang === "ko" ? "Switch to English" : "한국어로 보기");
  renderResearch(); renderCV(); reveal();
}

document.addEventListener("click", (e) => {
  const tg = e.target.closest(".toggle");
  if (tg) {
    const p = document.getElementById(tg.getAttribute("aria-controls")), open = tg.getAttribute("aria-expanded") !== "true";
    tg.setAttribute("aria-expanded", String(open)); tg.textContent = open ? L(UI.less) : moreLabel(+tg.dataset.n);
    p.dataset.open = String(open); p.setAttribute("aria-hidden", String(!open)); p.inert = !open; return;
  }
  const rz = e.target.closest("button.thumb[data-r]");
  if (rz) { const r = RESEARCH[+rz.dataset.r], med = M(r.media);
    open(L(UI.research), `<div class="md">${esc(L(r.st))}</div><h3 id="dlg-title">${esc(L(r.t))}</h3>${r.tag ? `<div class="mm">${esc(L(r.tag))}</div>` : ""}
      ${med.length ? figsHTML(med, L(r.t)) : `<div class="media"><figure><img src="${esc(r.thumb.src)}" alt="${esc(r.thumb.alt)}"></figure></div>`}
      ${r.lines.map((l) => `<p>${rich(l)}</p>`).join("")}`, rz); return; }
  const it = e.target.closest(".it[data-sec]");
  if (it) { const sec = CV.find((c) => c.id === it.dataset.sec), x = sec.items[+it.dataset.idx], med = M(x.media);
    open(L(sec.title), `<div class="md">${esc(L(x.date))}</div><h3 id="dlg-title">${esc(L(x.t))}</h3>${x.m ? `<div class="mm">${esc(L(x.m))}</div>` : ""}
      ${med.length ? figsHTML(med, L(x.t)) : x.media && SHOW_SLOTS ? `<div class="media">${slotHTML(x.media)}</div>` : ""}
      ${x.img ? `<figure><img src="${esc(x.img.src)}" alt="" loading="lazy"><figcaption>${esc(L(x.img.cap))}</figcaption></figure>` : ""}
      ${sec.compact && x.ln ? `<p>${esc(L(x.ln))}</p>` : ""}
      ${x.courses ? `<div class="courses">${x.courses.map(([g, list]) => `<div class="cg"><div class="cgh">${esc(L(g))}</div><ul>${list.map(([en, ko]) => `<li><span>${esc(lang === "ko" ? ko : en)}</span></li>`).join("")}</ul></div>`).join("")}</div>` : ""}
      ${x.d ? `<ul>${L(x.d).map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : x.ln && !sec.compact ? `<p>${esc(L(x.ln))}</p>` : ""}`, it); return; }
});

const dlg = $("#dlg"); let opener = null;
function open(kind, html, trig) { $("#dlg-kind").textContent = kind; $("#dlg-body").innerHTML = html; opener = trig; dlg.showModal(); dlg.scrollTop = 0; }
$("#dlg-close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("close", () => { $("#dlg-body").innerHTML = ""; if (opener?.isConnected) opener.focus({ preventScroll: true }); });

let io;
function reveal() {
  const els = [...document.querySelectorAll(".reveal:not(.in)")];
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) { els.forEach((x) => x.classList.add("in")); return; }
  io = io || new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: .08 });
  els.forEach((x) => io.observe(x));
}
window.addEventListener("scroll", () => $("#topbar").classList.toggle("scrolled", scrollY > 8), { passive: true });
$("#lang").addEventListener("click", () => { lang = lang === "ko" ? "en" : "ko"; store.set("lang", lang); render(); });
$("#year").textContent = new Date().getFullYear();
if (CONFIG.photo) { const p = $("#photo"); p.src = CONFIG.photo; p.alt = PROFILE.name; p.hidden = false; }
const q = new URLSearchParams(location.search).get("lang");
lang = q === "ko" || q === "en" ? q : (store.get("lang") || ((navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "en"));
render();
})();
</script>
</body>
</html>
